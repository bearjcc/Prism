<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Facebook Home live-shaped fixture</title>
  </head>
  <body>
    <main role="main">
      <div class="feed-container-theme">
        <div class="feed-shared-wrapper">
          <div role="feed" data-facebook-home-feed>
            <div
              class="feed-story-wrapper"
              role="article"
              data-fixture-kind="friend"
              data-urn="urn:fb:story:live-friend"
            >
              <div class="fb-feed-author">
                <span class="fb-author-name">Dana Direct</span>
                <span aria-label="Friends">Friends</span>
              </div>
              <div class="fb-post-content">Live-shaped friend post</div>
            </div>
            <div
              class="feed-story-wrapper"
              role="article"
              data-fixture-kind="sponsored"
              data-urn="urn:fb:story:live-sponsored"
            >
              <div class="fb-feed-author">
                <span class="fb-author-name">Ad Brand</span>
              </div>
              <span>Sponsored</span>
              <div class="fb-post-content">Live-shaped sponsored post</div>
            </div>
            <div
              class="feed-story-wrapper"
              role="article"
              data-fixture-kind="suggested"
              data-urn="urn:fb:story:live-suggested"
            >
              <span>Suggested for you</span>
              <div class="fb-feed-author">
                <span class="fb-author-name">Suggested Author</span>
              </div>
            </div>
            <div
              class="feed-story-wrapper"
              role="article"
              data-fixture-kind="page"
              data-urn="urn:fb:story:live-page"
            >
              <div class="fb-feed-author">
                <span class="fb-author-name">Northwind Page</span>
                <span data-page-indicator="page">Page</span>
              </div>
            </div>
            <div
              class="feed-story-wrapper"
              role="article"
              data-fixture-kind="group"
              data-urn="urn:fb:story:live-group"
            >
              <span>Posted in Running Club</span>
              <div class="fb-feed-author">
                <span class="fb-author-name">Group Poster</span>
              </div>
            </div>
            <div
              class="feed-story-wrapper"
              role="article"
              data-fixture-kind="activity-reshare"
              data-urn="urn:fb:story:live-activity"
            >
              <span class="fb-activity-header">Eve Friend shared a post</span>
              <div class="fb-feed-author">
                <span class="fb-author-name">Unknown Page</span>
                <span data-page-indicator="page">Page</span>
              </div>
            </div>
            <section
              role="region"
              data-fixture-kind="module"
              data-urn="urn:fb:module:live-reels"
            >
              <h2>Reels for you</h2>
            </section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
