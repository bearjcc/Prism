id: prism.kitten-ad-replace
version: 1.0.0
runtime: native
capabilities:
  required:
    - visual.ad-slot.replace
  optional:
    - network.browser.block
    - network.egress
scopes:
  - <all_urls>
egress:
  contracts:
    - id: remote-kitten-images
      url: https://cataas.com/cat*
      methods:
        - GET
filters:
  browser:
    - filters/browser/ads.txt
assets:
  - assets/kitten-1.svg
  - assets/kitten-2.svg
  - assets/kitten-3.svg
  - assets/kitten-4.svg
  - assets/kitten-5.svg
  - assets/kitten-6.svg
  - assets/kitten-7.svg
  - assets/kitten-8.svg
  - assets/kitten-9.svg
  - assets/kitten-10.svg
fixtures:
  - fixtures/ads.html
