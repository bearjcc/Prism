<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LinkedIn Home live-shaped fixture</title>
  </head>
  <body>
    <main class="scaffold-layout__main">
      <div class="feed-container-theme">
        <div class="feed-shared-update-v2__control-menu-container">
          <div class="scaffold-finite-scroll__content" data-linkedin-home-feed>
            <div
              class="feed-shared-update-v2__wrapper"
              data-view-name="feed-full-update"
              data-fixture-kind="first-degree"
              data-urn="urn:li:activity:live-first-degree"
            >
              <div class="update-components-actor">
                <span class="update-components-actor__name">Dana Direct</span>
                <span class="update-components-actor__meta-link">
                  <span>1st</span>
                </span>
              </div>
              <div class="feed-shared-update-v2__description">Live-shaped first-degree post</div>
            </div>
            <div
              class="feed-shared-update-v2__wrapper"
              data-view-name="feed-full-update"
              data-fixture-kind="followed-page"
              data-urn="urn:li:activity:live-followed-page"
            >
              <div class="update-components-actor">
                <span class="update-components-actor__name">Northwind Pages</span>
              </div>
              <div class="feed-shared-update-v2__description">Live-shaped followed page post</div>
            </div>
            <div
              class="feed-shared-update-v2__wrapper"
              data-view-name="feed-full-update"
              data-fixture-kind="second-degree"
              data-urn="urn:li:activity:live-second-degree"
            >
              <div class="update-components-actor">
                <span class="update-components-actor__name">Eve Extended</span>
                <span class="update-components-actor__meta-link">
                  <span>3rd</span>
                </span>
              </div>
            </div>
            <div
              class="feed-shared-update-v2__wrapper"
              data-view-name="feed-full-update"
              data-fixture-kind="promoted"
              data-urn="urn:li:activity:live-promoted"
            >
              <div class="update-components-actor">
                <span class="update-components-actor__name">Ad Partner</span>
                <span class="update-components-actor__supplementary-actor-info">Sponsored</span>
              </div>
            </div>
            <div
              class="feed-shared-update-v2__wrapper"
              data-view-name="feed-full-update"
              data-fixture-kind="activity-reshare"
              data-urn="urn:li:activity:live-activity-reshare"
            >
              <span class="update-components-header__text-view">
                <span>Frank Follower likes this</span>
              </span>
              <div class="update-components-actor">
                <span class="update-components-actor__name">Hidden Author</span>
                <span class="update-components-actor__meta-link">
                  <span>2nd</span>
                </span>
              </div>
            </div>
            <section
              data-view-name="jobs-module"
              data-fixture-kind="module"
              data-urn="urn:li:module:jobs"
            >
              <h2>Jobs for you</h2>
            </section>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
