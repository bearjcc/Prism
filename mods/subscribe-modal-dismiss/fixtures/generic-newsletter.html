<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Generic newsletter fixture</title>
  </head>
  <body style="overflow: hidden">
    <main><p>Article text.</p></main>
    <div data-prism-subscribe-backdrop style="position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4)"></div>
    <div
      role="dialog"
      aria-modal="true"
      data-prism-subscribe-modal
      style="position: fixed; inset: 15%; background: #fff"
    >
      <p>Get our newsletter.</p>
      <input type="email" name="email" />
      <button type="button">Subscribe</button>
    </div>
  </body>
</html>
