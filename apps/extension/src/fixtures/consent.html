<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Consent interface fixture</title>
  </head>
  <body>
    <p id="page">Page content.</p>
    <div id="consent" data-prism-consent>
      <p>This is a labelled fixture consent panel, not a GDPR legal implementation.</p>
      <button id="accept" type="button">Accept</button>
      <button id="reject" type="button" data-prism-consent-reject>Reject</button>
      <button id="dismiss" type="button" data-prism-consent-dismiss hidden>Dismiss</button>
    </div>
  </body>
</html>
