<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Autoplay fixture</title>
  </head>
  <body>
    <p>Page content that must stay visible.</p>
    <button
      id="autonav"
      class="ytp-autonav-toggle-button"
      data-prism-autonav
      aria-checked="true"
      type="button"
    >
      Autonav
    </button>
    <video id="main-video" class="html5-main-video" autoplay></video>
    <video id="generic-video" autoplay></video>
    <audio id="generic-audio" autoplay></audio>
  </body>
</html>
