<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prism</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <h1>Prism</h1>
      <button id="undo" type="button">Undo last change</button>
    </header>
    <p id="page-origin">This site: loading...</p>
    <div id="origin-pause"></div>
    <section class="site-mods">
      <h2>Mods for this site</h2>
      <p id="find-mods"></p>
      <main id="mods" aria-live="polite">Loading mods...</main>
    </section>
    <section class="page-activity">
      <h2>This page</h2>
      <ol id="page-activity"></ol>
    </section>
    <footer class="popup-footer">
      <button id="open-options" type="button">Open Prism settings</button>
    </footer>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
